    description_html: >
      This feature was implemented by the course staff. I used it as an example of how to loop over the pixels in an image.
      <p></p>
      Here is an example output where the image is made brighter with <a href="batch.html?Push_Image=flower.jpg&Brightness=0.3" target="_blank">the luminance slider set to 0.3</a>:
